name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
      - run: python scripts/evaluate_ai.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag matchlens:ci .
      - run: docker run --detach --name matchlens-ci --publish 127.0.0.1:8000:8000 matchlens:ci
      - name: Smoke test container
        run: |
          for attempt in $(seq 1 30); do
            if python scripts/smoke_deployment.py http://127.0.0.1:8000 --timeout 3; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs matchlens-ci
      - name: Stop container
        if: always()
        run: docker rm --force matchlens-ci
